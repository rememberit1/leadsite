# Cloudflare Pages config (deploy later: npx wrangler pages deploy public)
name = "silverspring-plumbing-pros"
pages_build_output_dir = "public"
compatibility_date = "2026-10-01"

[[kv_namespaces]]
binding = "LEADS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
# Also set secret: npx wrangler pages secret put STATS_TOKEN
